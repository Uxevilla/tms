# Nginx — frontend React + API Gateway interno
# Usado por el contenedor `frontend` (montado en /etc/nginx/conf.d/default.conf).

# Log sin query string: el token del WebSocket viaja en ?token=... y no debe quedar en logs.
log_format main_noargs '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log main_noargs;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA de React (React Router): si la ruta no es un fichero, sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy de la API REST al backend FastAPI.
    location /api/ {
        proxy_pass http://tms-backend:8750/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Reverse proxy de WebSockets al backend FastAPI.
    # proxy_http_version 1.1 + cabeceras Upgrade/Connection son imprescindibles
    # para que la conexión del WebSocket no se caiga.
    location /ws/ {
        proxy_pass http://tms-backend:8750/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Grafana (KPIs) servido bajo /grafana/. Con serve_from_sub_path=true,
    # se pasa la URI /grafana/ sin reescribir (proxy_pass sin barra final).
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
